name: Release assets

# When a release is published on a build tag ({seq}.{yy}.{mm}.{dd}.{hhmm}.{branch}), attach the
# installers built by build.yml for that commit:
#   1. resolve the tag to its commit and that commit's build.yml run
#   2. download the run's artifacts
#   3. collect the installers of every platform, named <platform>__<name>
#   4. upload them to the release
# Other tags are ignored. The web build is not attached; pages.yml publishes it.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Build tag to attach the installers to"
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: release-assets-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  attach:
    name: Attach installers
    runs-on: ubuntu-latest
    steps:
      - name: Resolve build run for the tag
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${TAG:-}" =~ ^[0-9]{5}\.[0-9]{2}\.[0-9]{2}\.[0-9]{2}\.[0-9]{4}\..+$ ]]; then
            echo "Tag '${TAG:-}' is not a build string, nothing to attach"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

          REF_JSON=$(gh api "repos/${REPO}/git/ref/tags/${TAG}")
          OBJECT_TYPE=$(printf '%s' "$REF_JSON" | jq -r .object.type)
          OBJECT_SHA=$(printf '%s' "$REF_JSON" | jq -r .object.sha)
          if [[ "$OBJECT_TYPE" == "tag" ]]; then
            COMMIT_SHA=$(gh api "repos/${REPO}/git/tags/${OBJECT_SHA}" --jq .object.sha)
          else
            COMMIT_SHA="$OBJECT_SHA"
          fi
          echo "Tag $TAG -> commit $COMMIT_SHA"

          # Prefer a fully successful run; otherwise take the latest completed one
          # (build.yml still tags when a platform fails, so some installers may be missing).
          RUN_ID=$(gh run list \
            --repo "$REPO" \
            --workflow build.yml \
            --commit "$COMMIT_SHA" \
            --status completed \
            --limit 30 \
            --json databaseId,conclusion,createdAt \
            --jq '
              (
                [.[] | select(.conclusion == "success")]
                | sort_by(.createdAt)
                | reverse
                | .[0].databaseId
              )
              // (
                sort_by(.createdAt)
                | reverse
                | .[0].databaseId
              )
              // empty
            ')

          if [[ -z "$RUN_ID" ]]; then
            echo "No completed build.yml run found for commit $COMMIT_SHA"
            exit 1
          fi
          echo "Using run $RUN_ID"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download the artifacts
        if: steps.resolve.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ steps.resolve.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          gh run download "$RUN_ID" --repo "$REPO" --dir artifacts
          find artifacts -type f | sort | head -n 80

      - name: Collect the installers
        if: steps.resolve.outputs.skip == 'false'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p upload

          is_installer() {
            case "$1" in
              *.exe|*.dmg|*.app.tar.gz|*.deb|*.rpm|*.AppImage) return 0 ;;
              *) return 1 ;;
            esac
          }

          # each platform's artifact is datamine-explorer-<platform>; the web build is not an installer
          for dir in artifacts/datamine-explorer-*; do
            [[ -d "$dir" ]] || continue
            platform=${dir#artifacts/datamine-explorer-}
            [[ "$platform" == "web" ]] && continue
            while IFS= read -r -d '' f; do
              base=$(basename "$f")
              case "$base" in
                *.blockmap|*.sig) continue ;;
              esac
              is_installer "$base" || continue
              cp -f "$f" "upload/${platform}__${base}"
              echo "Queued ${platform}__${base}"
            done < <(find "$dir" -type f -print0)
          done

          if [[ -z "$(ls -A upload)" ]]; then
            echo "No installers in the build artifacts."
            exit 1
          fi
          ls -lh upload

      - name: Upload to the release
        if: steps.resolve.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(upload/*)
          # --repo is needed: this job has no checkout. --clobber replaces same-named assets on a re-run.
          gh release upload "$TAG" "${files[@]}" --repo "$REPO" --clobber
          echo "Uploaded ${#files[@]} asset(s) to $TAG"
