name: Build

# Every branch push builds the app for Windows, macOS and Linux, builds the browser version for
# GitHub Pages, and tags the commit with its Bungie-style build string,
# {seq}.{yy}.{mm}.{dd}.{hhmm}.{branch} (see scripts/compute-build-string.mjs).
# Pull requests build untracked in build_pr.yml. Release assets are attached by
# release-assets.yml when a release is published on a build tag; the Pages root is published by
# pages.yml.
#
# Bundle targets are listed in src-tauri/tauri.conf.json (JSON has no comments, so it is noted here):
# nsis, dmg, app, deb, rpm, appimage. "all" would add msi, and WiX needs every version part to be
# 255 or less, but the bundle version is 0.{seq}.0 and seq is the run number.
# macOS builds are unsigned and not notarized.
on:
  push:
    branches:
      - "**"
      - "!gh-pages"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare build string
    runs-on: ubuntu-latest
    outputs:
      build_string: ${{ steps.compute.outputs.build_string }}
      build_info: ${{ steps.compute.outputs.build_info }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Compute build string
        id: compute
        shell: bash
        env:
          DATAMINE_EXPLORER_BRANCH: ${{ github.ref_name }}
          DATAMINE_EXPLORER_SEQ: ${{ github.run_number }}
        run: |
          INFO=$(node scripts/compute-build-string.mjs)
          BUILD_STRING=$(node -e "process.stdout.write(JSON.parse(process.argv[1]).buildString)" "$INFO")
          echo "build_info=$INFO" >> "$GITHUB_OUTPUT"
          echo "build_string=$BUILD_STRING" >> "$GITHUB_OUTPUT"
          echo "Computed build string: $BUILD_STRING"

  web:
    name: Web bundle
    needs: prepare
    runs-on: ubuntu-latest
    env:
      DATAMINE_EXPLORER_BUILD_INFO: ${{ needs.prepare.outputs.build_info }}
      # Relative base, so the same build works at the Pages root and under /<branch>/.
      DATAMINE_EXPLORER_BASE: ./
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # @blamnetwork/datamine comes from npm.
      - run: npm ci

      - name: Build the web version
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: datamine-explorer-web
          path: dist
          retention-days: 90
          if-no-files-found: error

  pages:
    name: Deploy Pages preview
    needs: web
    if: success() && github.ref != 'refs/heads/gh-pages'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Resolve destination
        id: target
        shell: bash
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          case "$BRANCH" in
            docs|assets|gh-pages|.github|"")
              echo "Branch name '$BRANCH' is reserved or empty."
              exit 1
              ;;
          esac
          echo "destination=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "Deploying Pages preview to /$BRANCH/"

      - uses: actions/download-artifact@v4
        with:
          name: datamine-explorer-web
          path: dist

      - name: Verify dist
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f dist/index.html ]]; then
            echo "datamine-explorer-web artifact is missing index.html"
            find dist -maxdepth 3 -type f | head -n 50 || true
            exit 1
          fi

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          destination_dir: ${{ steps.target.outputs.destination }}
          keep_files: true
          force_orphan: false

  build:
    name: Build (${{ matrix.name }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            name: windows
          - platform: macos-latest
            name: macos
          - platform: ubuntu-22.04
            name: linux
    runs-on: ${{ matrix.platform }}
    env:
      DATAMINE_EXPLORER_BUILD_INFO: ${{ needs.prepare.outputs.build_info }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # @blamnetwork/datamine comes from npm. package-lock.json lists every platform's optional
      # native packages (@tauri-apps/cli-*, rollup, esbuild), so npm ci needs no binding workaround.
      - run: npm ci

      # The bundle version is 0.{seq}.0; tauri.conf.json and Cargo.toml keep their committed 0.1.0.
      - name: Write Tauri version config
        shell: bash
        run: |
          node -e "require('fs').writeFileSync('tauri.version.json', JSON.stringify({ version: JSON.parse(process.env.DATAMINE_EXPLORER_BUILD_INFO).packageVersion }))"
          cat tauri.version.json

      - name: Build the app
        run: npx tauri build --config tauri.version.json

      - name: Name the installers after the build string
        shell: bash
        env:
          BUILD_STRING: ${{ needs.prepare.outputs.build_string }}
          PLATFORM: ${{ matrix.name }}
        run: |
          set -euo pipefail
          BUNDLE=src-tauri/target/release/bundle
          NAME="datamine-explorer-${BUILD_STRING}"
          mkdir -p staging
          case "$PLATFORM" in
            windows)
              cp "$BUNDLE"/nsis/*.exe "staging/${NAME}-setup.exe"
              cp src-tauri/target/release/datamine-explorer.exe "staging/${NAME}.exe"
              ;;
            macos)
              cp "$BUNDLE"/dmg/*.dmg "staging/${NAME}.dmg"
              APP=$(ls -d "$BUNDLE"/macos/*.app)
              tar -czf "staging/${NAME}.app.tar.gz" -C "$(dirname "$APP")" "$(basename "$APP")"
              ;;
            linux)
              cp "$BUNDLE"/deb/*.deb "staging/${NAME}.deb"
              cp "$BUNDLE"/rpm/*.rpm "staging/${NAME}.rpm"
              cp "$BUNDLE"/appimage/*.AppImage "staging/${NAME}.AppImage"
              ;;
          esac
          ls -l staging

      - uses: actions/upload-artifact@v4
        with:
          name: datamine-explorer-${{ matrix.name }}
          path: staging/*
          if-no-files-found: error

  tag:
    name: Tag build
    needs: [prepare, web, build]
    # Tag even when a build fails: seq is the run number and has to stay unique per commit.
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create build tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.build_string }}
          SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$TAG" || "$TAG" == "untracked version" ]]; then
            echo "Refusing to tag untracked build"
            exit 1
          fi

          if gh api "repos/${REPO}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag $TAG already exists"
            exit 0
          fi

          TAG_OBJECT=$(gh api "repos/${REPO}/git/tags" \
            -f tag="$TAG" \
            -f message="Build $TAG" \
            -f object="$SHA" \
            -f type=commit)
          TAG_SHA=$(printf '%s' "$TAG_OBJECT" | jq -r .sha)

          gh api "repos/${REPO}/git/refs" \
            -f ref="refs/tags/${TAG}" \
            -f sha="$TAG_SHA"
          echo "Tagged $SHA as $TAG"
