name: Build (PR)

# Pull requests build as "untracked version": no seq, no tag, version 0.0.1. The same platforms as
# build.yml, with a -pr suffix on the artifacts. Nothing is deployed to Pages.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  web:
    name: Web bundle
    runs-on: ubuntu-latest
    env:
      DATAMINE_EXPLORER_UNTRACKED: "1"
      DATAMINE_EXPLORER_BASE: ./
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # @blamnetwork/datamine comes from npm.
      - run: npm ci

      # With no build info in the environment, vite computes the untracked one itself.
      - name: Build the web version
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: datamine-explorer-web-pr
          path: dist
          if-no-files-found: error

  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            name: windows
          - platform: macos-latest
            name: macos
          - platform: ubuntu-22.04
            name: linux
    runs-on: ${{ matrix.platform }}
    env:
      DATAMINE_EXPLORER_UNTRACKED: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # @blamnetwork/datamine comes from npm. package-lock.json lists every platform's optional
      # native packages, so npm ci needs no Tauri CLI binding workaround.
      - run: npm ci

      # Build info is computed untracked, then handed to vite and the Tauri version config.
      - name: Compute untracked build info
        shell: bash
        run: |
          INFO=$(node scripts/compute-build-string.mjs)
          echo "DATAMINE_EXPLORER_BUILD_INFO=$INFO" >> "$GITHUB_ENV"
          node -e "require('fs').writeFileSync('tauri.version.json', JSON.stringify({ version: JSON.parse(process.argv[1]).packageVersion }))" "$INFO"

      # Bundle targets are in src-tauri/tauri.conf.json: nsis, dmg, app, deb, rpm, appimage (no msi, see build.yml).
      - name: Build the app
        run: npx tauri build --config tauri.version.json

      - name: Name the installers
        shell: bash
        env:
          PLATFORM: ${{ matrix.name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          BUNDLE=src-tauri/target/release/bundle
          NAME="datamine-explorer-pr${PR_NUMBER}-${HEAD_SHA:0:7}"
          mkdir -p staging
          case "$PLATFORM" in
            windows)
              cp "$BUNDLE"/nsis/*.exe "staging/${NAME}-setup.exe"
              cp src-tauri/target/release/datamine-explorer.exe "staging/${NAME}.exe"
              ;;
            macos)
              cp "$BUNDLE"/dmg/*.dmg "staging/${NAME}.dmg"
              APP=$(ls -d "$BUNDLE"/macos/*.app)
              tar -czf "staging/${NAME}.app.tar.gz" -C "$(dirname "$APP")" "$(basename "$APP")"
              ;;
            linux)
              cp "$BUNDLE"/deb/*.deb "staging/${NAME}.deb"
              cp "$BUNDLE"/rpm/*.rpm "staging/${NAME}.rpm"
              cp "$BUNDLE"/appimage/*.AppImage "staging/${NAME}.AppImage"
              ;;
          esac
          ls -l staging

      - uses: actions/upload-artifact@v4
        with:
          name: datamine-explorer-${{ matrix.name }}-pr
          path: staging/*
          if-no-files-found: error
