[package]
name = "datamine-explorer"
version = "0.1.0"
description = "Desktop explorer for Bungie-style event logs and datamine files"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
notify = "8"
serde_json = "1"
serde = { version = "1", features = ["derive"] }

[profile.release]
strip = true
